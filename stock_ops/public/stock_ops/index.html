    <style>
      /* Splash: tampil seketika (sebelum JS/CSS app), dilepas main.js setelah app tampil. */
      #splash { position: fixed; inset: 0; z-index: 9999; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; background: linear-gradient(160deg, #2e251b, #1a140e); color: #a4896c; transition: opacity .35s ease; }

      #splash img { width: 150px; height: 150px; animation: sp-in .6s ease-out both; }
      #splash .sp-name { font: 600 13px/1 system-ui, -apple-system, 'Segoe UI', sans-serif; letter-spacing: .42em; padding-left: .42em; text-transform: uppercase; animation: sp-in .6s .15s ease-out both; }
      #splash .sp-bar { width: 120px; height: 3px; border-radius: 3px; background: rgba(164, 137, 108, .22); overflow: hidden; margin-top: 6px; }
      #splash .sp-bar i { display: block; width: 40%; height: 100%; background: #a4896c; border-radius: 3px; animation: sp-run 1.1s ease-in-out infinite; }
      @keyframes sp-run { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
      @keyframes sp-in { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
